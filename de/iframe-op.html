<!-- Vložit do HTML obsahu stránky AGB na stepar-med.de. -->
<iframe id="stepar-legal-de-op" src="https://vaclavstepar.github.io/stepar-legal/de/op.html" title="Allgemeine Geschäftsbedingungen – ŠTĚPAŘ" style="display:block;width:100%;height:14000px;border:0;background:transparent" loading="eager"></iframe>
<p><a href="https://vaclavstepar.github.io/stepar-legal/de/op-current.html" target="_blank" rel="noopener">AGB separat öffnen, speichern oder drucken</a></p>
<script>
(() => {
  const frame = document.getElementById('stepar-legal-de-op');
  window.addEventListener('message', event => {
    if (event.origin !== 'https://vaclavstepar.github.io' || event.source !== frame.contentWindow || event.data?.type !== 'stepar-legal-height') return;
    const height = Number(event.data.height);
    if (Number.isFinite(height) && height >= 100 && height <= 100000) frame.style.height = Math.ceil(height + 24) + 'px';
  });
})();
</script>
