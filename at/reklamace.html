<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Informationen zu Gewährleistung und Reklamation</title>
<style>body{font-family:Arial,Helvetica,sans-serif;line-height:1.6;color:#222;margin:0;padding:20px}a{color:inherit}</style>
</head>
<body>
<div id="app"><p>Aktuelles Dokument wird geladen…</p></div>
<script>
(async function(){
  const url='reklamace-current.html?t='+Date.now();
  try{
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const html=await r.text();
    const doc=new DOMParser().parseFromString(html,'text/html');
    const style=doc.querySelector('style');
    if(style) document.head.appendChild(style.cloneNode(true));
    if(doc.title) document.title=doc.title;
    const app=document.getElementById('app');
    const nodes=Array.from(doc.body.childNodes).map(function(n){return n.cloneNode(true);});
    app.replaceWith(...nodes);
  }catch(e){
    document.getElementById('app').innerHTML='<p>Das Dokument konnte nicht geladen werden. <a href="reklamace-current.html">Aktuelle Fassung öffnen</a>.</p>';
  }
})();
</script>
</body>
</html>
