<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Splošni pogoji poslovanja | ŠTĚPAŘ s.r.o.</title>
<style>html,body{margin:0;padding:0;background:transparent}body{font-family:Arial,Helvetica,sans-serif;color:#222}.loading{max-width:1040px;margin:0 auto;padding:24px 18px;box-sizing:border-box}</style>
</head>
<body>
<div id="legal-content" class="loading">Nalaganje veljavnih splošnih pogojev…</div>
<script>
(async function(){
  const target=document.getElementById('legal-content');
  try{
    const url='op-current.html?t='+Date.now();
    const response=await fetch(url,{cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    const html=await response.text();
    const doc=new DOMParser().parseFromString(html,'text/html');
    document.title=doc.title||document.title;
    const style=doc.querySelector('style');
    if(style){document.head.appendChild(style.cloneNode(true));}
    target.className='';
    target.innerHTML=doc.body.innerHTML;
  }catch(e){
    target.innerHTML='<h1>Splošni pogoji poslovanja</h1><p>Veljavne vsebine ni bilo mogoče naložiti. <a href="op-current.html?reload='+Date.now()+'">Odprite pogoje neposredno</a>.</p>';
  }
})();
</script>
<noscript><div class="loading"><p><a href="op-current.html">Odprite veljavne splošne pogoje</a></p></div></noscript>
</body>
</html>
