<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Política de privacidad | ŠTĚPAŘ</title><style>body{margin:0;font:14px/1.6 Arial,sans-serif}.loading{padding:20px}</style></head><body>
<div id="legal-content" class="loading" aria-live="polite">Cargando la política de privacidad…</div>
<script>
(async function(){
 const target=document.getElementById('legal-content');
 try{
  const response=await fetch('privacy-current.html?t='+Date.now(),{cache:'no-store'});
  if(!response.ok) throw new Error('HTTP '+response.status);
  const doc=new DOMParser().parseFromString(await response.text(),'text/html');
  document.title=doc.title||document.title;
  for(const style of doc.querySelectorAll('style')) document.head.appendChild(style.cloneNode(true));
  target.className=''; target.replaceChildren(...Array.from(doc.body.childNodes));
 }catch(error){
  target.textContent='No se ha podido cargar el texto. ';
  const link=document.createElement('a');link.href='privacy-current.html';link.textContent='Abrir el texto directamente';target.appendChild(link);
 }
})();
</script><noscript><p><a href="privacy-current.html">Abrir la política de privacidad</a></p></noscript></body></html>
