<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Všeobecné obchodní podmínky | ŠTĚPAŘ s.r.o.</title>
  <style>
    html,body{margin:0;padding:0;background:transparent}
    body{font-family:Arial,Helvetica,sans-serif;color:#222;font-size:15px;line-height:1.6}
    .loading{max-width:1040px;margin:0 auto;padding:24px 18px;box-sizing:border-box}
  </style>
</head>
<body>
  <div class="loading">Načítám aktuální obchodní podmínky…</div>
  <script>
    (async function () {
      try {
        const url = 'op-current.html?t=' + Date.now();
        const response = await fetch(url, {
          cache: 'no-store',
          credentials: 'same-origin',
          headers: { 'Cache-Control': 'no-cache' }
        });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const html = await response.text();
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<div class="loading"><strong>Obchodní podmínky se nepodařilo načíst.</strong><br>Zkuste prosím stránku obnovit.</div>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
