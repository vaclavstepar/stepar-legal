name: Build Slovak complaint form

on:
  push:
    paths:
      - '.build/sk-reklamacny-formular/build'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build DOCX
        shell: bash
        run: |
          cat .build/sk-reklamacny-formular/part01 \
              .build/sk-reklamacny-formular/chunk02a \
              .build/sk-reklamacny-formular/chunk02b \
              .build/sk-reklamacny-formular/part02b \
              .build/sk-reklamacny-formular/part03 \
              .build/sk-reklamacny-formular/part04a \
              .build/sk-reklamacny-formular/chunk07a \
              .build/sk-reklamacny-formular/chunk07b \
              .build/sk-reklamacny-formular/part05 > /tmp/reklamacny-formular.b64
          test "$(wc -c < /tmp/reklamacny-formular.b64)" -eq 53492
          base64 --decode /tmp/reklamacny-formular.b64 > sk/reklamacny-formular.docx
          test "$(wc -c < sk/reklamacny-formular.docx)" -eq 40117
          echo "b42224a2b5dc82defe88f61f0340578dd0fe85a5f964992050d07bd8a92c8089  sk/reklamacny-formular.docx" | sha256sum -c -
          unzip -t sk/reklamacny-formular.docx

      - name: Commit generated Word form
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sk/reklamacny-formular.docx
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Build Slovak complaint form DOCX'
          git push
